<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Brandivo Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233b6bff'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='56' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .admin-login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .admin-login-card {
      max-width: 450px;
      width: 100%;
      background: var(--ink-2);
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-lg);
      padding: 48px 40px;
      box-shadow: 0 20px 60px -20px rgba(0,0,0,0.5);
    }
    .admin-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .admin-logo-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 16px;
      background: var(--gradient);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      color: white;
    }
    .admin-logo h2 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    .admin-logo p {
      font-size: 0.9rem;
      color: var(--slate-dim);
    }
    .login-form {
      margin-top: 32px;
    }
    .form-group {
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--paper);
      font-size: 0.9rem;
    }
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: var(--paper);
      font-size: 0.95rem;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--electric);
      box-shadow: 0 0 0 3px rgba(59, 107, 255, 0.1);
    }
    .form-error {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: var(--radius-sm);
      color: #ef4444;
      font-size: 0.85rem;
    }
    .form-error.show {
      display: block;
    }
    .login-btn {
      width: 100%;
      margin-top: 8px;
    }
    .back-link {
      text-align: center;
      margin-top: 24px;
    }
    .back-link a {
      color: var(--slate);
      font-size: 0.9rem;
      transition: color 0.3s;
    }
    .back-link a:hover {
      color: var(--electric-light);
    }
  </style>
</head>
<body>
  <div class="admin-login-wrapper">
    <div class="admin-login-card">
      <div class="admin-logo">
        <div class="admin-logo-icon">B</div>
        <h2>Admin Panel</h2>
        <p>Brandivo Studio CMS</p>
      </div>

      <form class="login-form" id="adminLoginForm">
        <div class="form-group">
          <label for="adminEmail">
            <i class="fa-solid fa-envelope"></i> Email Address
          </label>
          <input
            type="email"
            id="adminEmail"
            name="email"
            placeholder="Enter your email"
            required
            autocomplete="username">
        </div>

        <div class="form-group">
          <label for="adminPassword">
            <i class="fa-solid fa-lock"></i> Password
          </label>
          <input
            type="password"
            id="adminPassword"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password">
        </div>

        <div class="form-error" id="loginError">
          <i class="fa-solid fa-circle-exclamation"></i> Invalid email or password. Please try again.
        </div>

        <button type="submit" class="btn btn-primary login-btn">
          <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
        </button>
      </form>

      <div class="back-link">
        <a href="index.html">
          <i class="fa-solid fa-arrow-left"></i> Back to Website
        </a>
      </div>
    </div>
  </div>

  <script>
    // Admin credentials
    const ADMIN_CREDENTIALS = {
      email: 'lucifer951@gmail.com',
      password: 'Payal@1'
    };

    // Handle login form submission
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;
      const errorDiv = document.getElementById('loginError');

      // Validate credentials
      if (email === ADMIN_CREDENTIALS.email && password === ADMIN_CREDENTIALS.password) {
        // Store session
        sessionStorage.setItem('adminLoggedIn', 'true');
        sessionStorage.setItem('adminEmail', email);
        sessionStorage.setItem('loginTime', new Date().toISOString());

        // Redirect to dashboard
        window.location.href = 'admin-dashboard.html';
      } else {
        // Show error
        errorDiv.classList.add('show');

        // Shake animation
        const card = document.querySelector('.admin-login-card');
        card.style.animation = 'shake 0.5s';
        setTimeout(() => {
          card.style.animation = '';
        }, 500);
      }
    });

    // Add shake animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
        20%, 40%, 60%, 80% { transform: translateX(10px); }
      }
    `;
    document.head.appendChild(style);

    // Check if already logged in
    if (sessionStorage.getItem('adminLoggedIn') === 'true') {
      window.location.href = 'admin-dashboard.html';
    }
  </script>
</body>
</html>
